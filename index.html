<!DOCTYPE html>

<html lang="en">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Recipe Catcher</title>

<style>

body {

  margin: 0;

  padding: 20px;

  background: #f8f5ed;

  color: #34372f;

  font-family: Arial, sans-serif;

}

header {

  text-align: center;

  padding: 20px;

}

h1 {

  color: #65765b;

  font-family: Georgia, serif;

  font-size: 34px;

  font-weight: normal;

}

.panel {

  background: #fffefa;

  border-radius: 16px;

  padding: 20px;

  margin: 15px auto;

  max-width: 550px;

}

input, textarea, select {

  width: 100%;

  box-sizing: border-box;

  padding: 13px;

  margin: 8px 0;

  border: 1px solid #deded3;

  border-radius: 9px;

  font-size: 16px;

}

textarea { min-height: 90px; }

button {

  padding: 13px 18px;

  border: 0;

  border-radius: 9px;

  background: #65765b;

  color: white;

  font-size: 15px;

  margin: 5px 0;

}

.recipe {

  border-bottom: 1px solid #ddd;

  padding: 14px 0;

}

</style>

</head>

<body>

<header>

  <h1>Recipe Catcher</h1>

  <p>Good recipes are worth keeping.</p>

</header>

<div class="panel">

  <h2>My Recipe Box</h2>

  <input id="search" placeholder="Search my recipes">

  <button onclick="showRecipes()">Search</button>

</div>

<div class="panel">

  <h2>Add a Recipe</h2>

  <input id="title" placeholder="Recipe name">

  <select id="category">

    <option>Main Dish</option>

    <option>Side Dish</option>

    <option>Appetizer</option>

    <option>Soup</option>

    <option>Salad</option>

    <option>Dessert</option>

    <option>Bread</option>

    <option>Breakfast</option>

    <option>Miscellaneous</option>

  </select>

  <input id="prep" placeholder="Prep time">

  <input id="cook" placeholder="Cook time">

  <input id="servings" placeholder="Servings">

  <input id="temperature" placeholder="Oven temperature">

  <textarea id="ingredients" placeholder="Ingredients (one per line)"></textarea>

  <textarea id="instructions" placeholder="Instructions (one per line)"></textarea>

  <input id="source" placeholder="Original recipe link">

  <button onclick="saveRecipe()">Save Recipe</button>

  <p id="message"></p>

</div>

<div class="panel">

  <h2>Saved Recipes</h2>

  <div id="recipes"></div>

</div>

<script>

const SUPABASE_URL = "https://phrskzefdwmkzlhfqlfj.supabase.co";

const SUPABASE_ANON_KEY = eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBocnNremVmZHdta3psaGZxbGZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwODU1OTEsImV4cCI6MjEwOTY2MTU5MX0.0YGjakY7mdk-e7an89yk09UdcbEMsOuq6e4i6O7CnfU;

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;

let savedRecipes = [];

const authBar = document.createElement("div");

authBar.className = "panel";

authBar.innerHTML = `

  <h2 id="accountStatus">Recipe Catcher Account</h2>

  <button id="loginButton">Sign in</button>

  <button id="registerButton">Create account</button>

  <button id="logoutButton" style="display:none">Sign out</button>

  <p id="accountMessage"></p>

`;

document.querySelector("main").prepend(authBar);

const accountMessage = document.getElementById("accountMessage");

const accountStatus = document.getElementById("accountStatus");

function message(text) {

  document.getElementById("message").textContent = text;

}

async function signIn() {

  const email = prompt("Enter your email address:");

  if (!email) return;

  const password = prompt("Enter your password:");

  if (!password) return;

  const { data, error } = await db.auth.signInWithPassword({

    email, password

  });

  if (error) {

    accountMessage.textContent = error.message;

    return;

  }

  currentUser = data.user;

  await startApp();

}

async function register() {

  const email = prompt("Enter your email address:");

  if (!email) return;

  const password = prompt("Create a password (at least 6 characters):");

  if (!password) return;

  const { data, error } = await db.auth.signUp({

    email, password

  });

  if (error) {

    accountMessage.textContent = error.message;

    return;

  }

  if (data.session) {

    currentUser = data.user;

    await startApp();

  } else {

    accountMessage.textContent =

      "Account created! Check your email to confirm, then sign in.";

  }

}

async function logout() {

  await db.auth.signOut();

  currentUser = null;

  savedRecipes = [];

  accountStatus.textContent = "Recipe Catcher Account";

  document.getElementById("loginButton").style.display = "";

  document.getElementById("registerButton").style.display = "";

  document.getElementById("logoutButton").style.display = "none";

  accountMessage.textContent = "You are signed out.";

  renderRecipes();

}

async function startApp() {

  accountStatus.textContent = "My Recipe Catcher Account";

  document.getElementById("loginButton").style.display = "none";

  document.getElementById("registerButton").style.display = "none";

  document.getElementById("logoutButton").style.display = "";

  accountMessage.textContent = "Signed in successfully!";

  await loadRecipes();

}

async function loadRecipes() {

  const { data, error } = await db.from("recipes")

    .select("*")

    .order("created_at", { ascending: false });

  if (error) {

    accountMessage.textContent = "Couldn't load recipes: " + error.message;

    return;

  }

  savedRecipes = data || [];

  renderRecipes();

}

async function saveRecipe() {

  if (!currentUser) {

    message("Please sign in before saving recipes.");

    return;

  }

  const title = document.getElementById("title").value.trim();

  if (!title) {

    message("Please enter a recipe name.");

    return;

  }

  const recipe = {

    user_id: currentUser.id,

    title,

    category: document.getElementById("category").value,

    prep_time: parseInt(document.getElementById("prep").value) || null,

    cook_time: parseInt(document.getElementById("cook").value) || null,

    servings: document.getElementById("servings").value,

    temperature: document.getElementById("temperature").value,

    ingredients: document.getElementById("ingredients").value

      .split("\n").map(x => x.trim()).filter(Boolean),

    instructions: document.getElementById("instructions").value

      .split("\n").map(x => x.trim()).filter(Boolean),

    source_url: document.getElementById("source").value.trim()

  };

  const { error } = await db.from("recipes").insert(recipe);

  if (error) {

    message("Couldn't save: " + error.message);

    return;

  }

  message("Recipe saved to your cloud recipe box!");

  document.querySelectorAll("input, textarea").forEach(el => el.value = "");

  await loadRecipes();

}

function renderRecipes() {

  const list = document.getElementById("recipes");

  const search = (document.getElementById("search")?.value || "").toLowerCase();

  list.replaceChildren();

  const matches = savedRecipes.filter(r => {

    const ingredients = Array.isArray(r.ingredients)

      ? r.ingredients.join(" ")

      : "";

    return (r.title + " " + ingredients).toLowerCase().includes(search);

  });

  if (!currentUser) {

    list.textContent = "Sign in to see your saved recipes.";

    return;

  }

  if (!matches.length) {

    list.textContent = "No recipes found. Add your first recipe!";

    return;

  }

  matches.forEach(r => {

    const card = document.createElement("div");

    card.className = "recipe";

    const heading = document.createElement("h3");

    heading.textContent = r.title;

    card.appendChild(heading);

    const details = document.createElement("p");

    details.textContent =

      r.category + " | Prep: " + (r.prep_time || "—") +

      " min | Cook: " + (r.cook_time || "—") + " min";

    card.appendChild(details);

    const ingredients = document.createElement("p");

    ingredients.textContent = "Ingredients:\n" +

      (Array.isArray(r.ingredients) ? r.ingredients.join("\n") : "");

    card.appendChild(ingredients);

    const instructions = document.createElement("p");

    instructions.textContent = "Instructions:\n" +

      (Array.isArray(r.instructions) ? r.instructions.join("\n") : "");

    card.appendChild(instructions);

    if (r.servings) {

      const servings = document.createElement("p");

      servings.textContent = "Servings: " + r.servings;

      card.appendChild(servings);

    }

    if (r.temperature) {

      const temp = document.createElement("p");

      temp.textContent = "Temperature: " + r.temperature;

      card.appendChild(temp);

    }

    if (r.source_url) {

      const link = document.createElement("a");

      link.href = r.source_url;

      link.target = "_blank";

      link.rel = "noopener noreferrer";

      link.textContent = "Original recipe";

      card.appendChild(link);

    }

    const favorite = document.createElement("button");

    favorite.textContent = r.is_favorite ? "♥ Favorite" : "♡ Favorite";

    favorite.onclick = () => toggleFavorite(r);

    card.appendChild(favorite);

    const remove = document.createElement("button");

    remove.textContent = "Delete";

    remove.style.marginLeft = "8px";

    remove.onclick = () => deleteRecipe(r.id);

    card.appendChild(remove);

    list.appendChild(card);

  });

}

async function toggleFavorite(recipe) {

  const { error } = await db.from("recipes")

    .update({ is_favorite: !recipe.is_favorite })

    .eq("id", recipe.id);

  if (error) {

    accountMessage.textContent = error.message;

    return;

  }

  await loadRecipes();

}

async function deleteRecipe(id) {

  if (!confirm("Delete this recipe?")) return;

  const { error } = await db.from("recipes")

    .delete().eq("id", id);

  if (error) {

    accountMessage.textContent = error.message;

    return;

  }

  await loadRecipes();

}

document.getElementById("loginButton").onclick = signIn;

document.getElementById("registerButton").onclick = register;

document.getElementById("logoutButton").onclick = logout;

window.saveRecipe = saveRecipe;

window.showRecipes = renderRecipes;

db.auth.getSession().then(({ data, error }) => {

  if (error) {

    accountMessage.textContent = error.message;

    return;

  }

  if (data.session) {

    currentUser = data.session.user;

    startApp();

  } else {

    renderRecipes();

  }

});

</script>

</body>

</html>
</script>

</body>

</html>
